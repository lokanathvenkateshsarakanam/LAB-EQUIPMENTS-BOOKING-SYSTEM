<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab Equipment Booking System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            justify-content: center;
        }

        .nav-tabs button {
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s ease;
            background: white;
            color: #667eea;
            font-weight: 600;
        }

        .nav-tabs button.active {
            background: #667eea;
            color: white;
        }

        .nav-tabs button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }

        .equipment-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .equipment-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .equipment-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        .equipment-card h3 {
            margin-bottom: 10px;
        }

        .equipment-card .status {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            background: rgba(255,255,255,0.2);
            font-size: 0.85em;
            margin-top: 10px;
        }

        .equipment-card .status.available {
            background: #4ade80;
        }

        .equipment-card .status.booked {
            background: #ef4444;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 1em;
            transition: border-color 0.3s ease;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        button.btn {
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }

        .btn-danger {
            background: #ef4444;
            color: white;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        .btn-secondary {
            background: #6b7280;
            color: white;
        }

        .btn-secondary:hover {
            background: #4b5563;
        }

        .booking-list {
            display: grid;
            gap: 15px;
        }

        .booking-item {
            background: #f9fafb;
            border-left: 4px solid #667eea;
            padding: 15px;
            border-radius: 5px;
        }

        .booking-item.expired {
            border-left-color: #ef4444;
            opacity: 0.6;
        }

        .booking-item h4 {
            margin-bottom: 8px;
            color: #333;
        }

        .booking-item p {
            margin-bottom: 5px;
            color: #666;
            font-size: 0.9em;
        }

        .booking-actions {
            margin-top: 10px;
            display: flex;
            gap: 10px;
        }

        .booking-actions button {
            padding: 8px 15px;
            font-size: 0.85em;
        }

        .alert {
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .alert-success {
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #6ee7b7;
        }

        .alert-error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5;
        }

        .alert-warning {
            background: #fef3c7;
            color: #92400e;
            border: 1px solid #fcd34d;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-card h3 {
            font-size: 2em;
            margin-bottom: 5px;
        }

        .stat-card p {
            opacity: 0.9;
        }

        .two-column {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .two-column {
                grid-template-columns: 1fr;
            }

            header h1 {
                font-size: 1.8em;
            }

            .nav-tabs {
                flex-wrap: wrap;
            }

            .equipment-grid {
                grid-template-columns: 1fr;
            }
        }

        .time-slots {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
        }

        .time-slot {
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .time-slot:hover {
            border-color: #667eea;
            background: #f3f4f6;
        }

        .time-slot.selected {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .time-slot.disabled {
            background: #f3f4f6;
            color: #9ca3af;
            cursor: not-allowed;
            border-color: #d1d5db;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #9ca3af;
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🧪 Lab Equipment Booking System</h1>
            <p>Reserve equipment for your experiments</p>
        </header>

        <div class="nav-tabs">
            <button class="tab-btn active" data-tab="browse">Browse Equipment</button>
            <button class="tab-btn" data-tab="booking">Book Equipment</button>
            <button class="tab-btn" data-tab="mybookings">My Bookings</button>
            <button class="tab-btn" data-tab="admin">Admin Panel</button>
        </div>

        <!-- Browse Equipment Tab -->
        <div id="browse" class="tab-content active">
            <div class="card">
                <h2>Available Lab Equipment</h2>
                <div id="equipmentList" class="equipment-grid"></div>
            </div>
        </div>

        <!-- Booking Tab -->
        <div id="booking" class="tab-content">
            <div class="card">
                <h2>Book Equipment</h2>
                <div id="bookingAlert"></div>
                
                <div class="two-column">
                    <div>
                        <div class="form-group">
                            <label for="equipmentSelect">Select Equipment *</label>
                            <select id="equipmentSelect" required>
                                <option value="">-- Choose Equipment --</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="userName">Your Name *</label>
                            <input type="text" id="userName" placeholder="Enter your full name" required>
                        </div>

                        <div class="form-group">
                            <label for="userEmail">Email *</label>
                            <input type="email" id="userEmail" placeholder="your@email.com" required>
                        </div>

                        <div class="form-group">
                            <label for="bookingDate">Booking Date *</label>
                            <input type="date" id="bookingDate" required>
                        </div>
                    </div>

                    <div>
                        <div class="form-group">
                            <label for="startTime">Start Time *</label>
                            <input type="time" id="startTime" required>
                        </div>

                        <div class="form-group">
                            <label for="endTime">End Time *</label>
                            <input type="time" id="endTime" required>
                        </div>

                        <div class="form-group">
                            <label for="purpose">Purpose of Use *</label>
                            <textarea id="purpose" placeholder="Describe what you'll use the equipment for..." rows="4" required></textarea>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label>Available Time Slots for Selected Date</label>
                    <div id="timeSlots" class="time-slots"></div>
                </div>

                <button class="btn btn-primary" onclick="bookEquipment()">Book Equipment</button>
            </div>
        </div>

        <!-- My Bookings Tab -->
        <div id="mybookings" class="tab-content">
            <div class="card">
                <h2>My Bookings</h2>
                <div class="stats">
                    <div class="stat-card">
                        <h3 id="totalBookings">0</h3>
                        <p>Total Bookings</p>
                    </div>
                    <div class="stat-card">
                        <h3 id="upcomingBookings">0</h3>
                        <p>Upcoming</p>
                    </div>
                    <div class="stat-card">
                        <h3 id="completedBookings">0</h3>
                        <p>Completed</p>
                    </div>
                </div>
                <div id="myBookingsList" class="booking-list"></div>
            </div>
        </div>

        <!-- Admin Panel Tab -->
        <div id="admin" class="tab-content">
            <div class="card">
                <h2>Admin Panel - Manage Equipment</h2>
                
                <h3 style="margin-top: 20px; margin-bottom: 15px;">Add New Equipment</h3>
                <div class="two-column">
                    <div>
                        <div class="form-group">
                            <label for="adminEquipName">Equipment Name *</label>
                            <input type="text" id="adminEquipName" placeholder="e.g., Oscilloscope">
                        </div>
                        <div class="form-group">
                            <label for="adminEquipCategory">Category *</label>
                            <input type="text" id="adminEquipCategory" placeholder="e.g., Electronic">
                        </div>
                    </div>
                    <div>
                        <div class="form-group">
                            <label for="adminEquipDesc">Description</label>
                            <textarea id="adminEquipDesc" placeholder="Equipment details..." rows="3"></textarea>
                        </div>
                    </div>
                </div>
                <button class="btn btn-primary" onclick="addEquipment()">Add Equipment</button>

                <h3 style="margin-top: 30px; margin-bottom: 15px;">Manage Equipment</h3>
                <div id="adminEquipmentList" class="equipment-grid"></div>

                <h3 style="margin-top: 30px; margin-bottom: 15px;">All Bookings</h3>
                <div id="adminBookingsList" class="booking-list"></div>
            </div>
        </div>
    </div>

    <script>
        // Default equipment
        const defaultEquipment = [
            { id: 1, name: 'Oscilloscope', category: 'Electronics', description: 'Digital Oscilloscope 100MHz', maxBookingHours: 4 },
            { id: 2, name: 'Multimeter', category: 'Electronics', description: 'Digital Multimeter', maxBookingHours: 8 },
            { id: 3, name: 'Power Supply', category: 'Electronics', description: 'Variable Power Supply 0-30V', maxBookingHours: 6 },
            { id: 4, name: 'Microwave', category: 'Appliances', description: 'Laboratory Microwave', maxBookingHours: 3 },
            { id: 5, name: 'Spectrometer', category: 'Optical', description: 'UV-Vis Spectrometer', maxBookingHours: 2 },
            { id: 6, name: 'Centrifuge', category: 'Lab', description: 'High-Speed Centrifuge', maxBookingHours: 2 }
        ];

        let equipment = JSON.parse(localStorage.getItem('labEquipment')) || defaultEquipment;
        let bookings = JSON.parse(localStorage.getItem('labBookings')) || [];

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            setMinDate();
            populateEquipmentSelect();
            renderEquipmentBrowse();
            attachEventListeners();
        });

        function attachEventListeners() {
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', switchTab);
            });
            document.getElementById('equipmentSelect').addEventListener('change', updateTimeSlots);
            document.getElementById('bookingDate').addEventListener('change', updateTimeSlots);
        }

        function switchTab(e) {
            const tabName = e.target.dataset.tab;
            
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            
            document.getElementById(tabName).classList.add('active');
            e.target.classList.add('active');

            if (tabName === 'mybookings') renderMyBookings();
            if (tabName === 'admin') {
                renderAdminEquipment();
                renderAdminBookings();
            }
        }

        function setMinDate() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('bookingDate').min = today;
            document.getElementById('bookingDate').value = today;
        }

        function populateEquipmentSelect() {
            const select = document.getElementById('equipmentSelect');
            select.innerHTML = '<option value="">-- Choose Equipment --</option>';
            equipment.forEach(eq => {
                const option = document.createElement('option');
                option.value = eq.id;
                option.textContent = `${eq.name} (${eq.category})`;
                select.appendChild(option);
            });
        }

        function renderEquipmentBrowse() {
            const container = document.getElementById('equipmentList');
            container.innerHTML = '';
            
            if (equipment.length === 0) {
                container.innerHTML = '<div class="empty-state"><p>No equipment available</p></div>';
                return;
            }

            equipment.forEach(eq => {
                const availableSlots = countAvailableSlots(eq.id);
                const status = availableSlots > 0 ? 'Available' : 'Fully Booked';
                const statusClass = availableSlots > 0 ? 'available' : 'booked';
                
                const card = document.createElement('div');
                card.className = 'equipment-card';
                card.innerHTML = `
                    <h3>${eq.name}</h3>
                    <p><strong>Category:</strong> ${eq.category}</p>
                    <p><strong>Description:</strong> ${eq.description || 'N/A'}</p>
                    <p><strong>Max Booking:</strong> ${eq.maxBookingHours} hours</p>
                    <p><strong>Available Slots:</strong> ${availableSlots}</p>
                    <span class="status ${statusClass}">${status}</span>
                `;
                container.appendChild(card);
            });
        }

        function updateTimeSlots() {
            const equipId = document.getElementById('equipmentSelect').value;
            const date = document.getElementById('bookingDate').value;
            const container = document.getElementById('timeSlots');

            if (!equipId || !date) {
                container.innerHTML = '<p style="color: #9ca3af;">Select equipment and date to view slots</p>';
                return;
            }

            const eq = equipment.find(e => e.id == equipId);
            const times = generateTimeSlots();
            
            container.innerHTML = '';
            times.forEach(time => {
                const isAvailable = isTimeSlotAvailable(equipId, date, time);
                const slot = document.createElement('div');
                slot.className = `time-slot ${isAvailable ? '' : 'disabled'}`;
                slot.textContent = time;
                slot.onclick = () => isAvailable && selectTimeSlot(slot, time);
                container.appendChild(slot);
            });
        }

        function generateTimeSlots() {
            const slots = [];
            for (let i = 8; i < 18; i++) {
                slots.push(`${String(i).padStart(2, '0')}:00`);
            }
            return slots;
        }

        function isTimeSlotAvailable(equipId, date, time) {
            return !bookings.some(b => 
                b.equipmentId == equipId && 
                b.date === date && 
                b.startTime === time
            );
        }

        function selectTimeSlot(element, time) {
            document.querySelectorAll('.time-slot.selected').forEach(el => el.classList.remove('selected'));
            element.classList.add('selected');
            document.getElementById('startTime').value = time;
            
            const equipId = document.getElementById('equipmentSelect').value;
            const eq = equipment.find(e => e.id == equipId);
            const endHour = Math.min(parseInt(time) + 1, 18);
            document.getElementById('endTime').value = `${String(endHour).padStart(2, '0')}:00`;
        }

        function countAvailableSlots(equipId) {
            const today = new Date().toISOString().split('T')[0];
            let count = 0;
            
            for (let i = 0; i < 7; i++) {
                const date = new Date();
                date.setDate(date.getDate() + i);
                const dateStr = date.toISOString().split('T')[0];
                
                const times = generateTimeSlots();
                times.forEach(time => {
                    if (isTimeSlotAvailable(equipId, dateStr, time)) {
                        count++;
                    }
                });
            }
            return count;
        }

        function bookEquipment() {
            const equipId = document.getElementById('equipmentSelect').value;
            const name = document.getElementById('userName').value;
            const email = document.getElementById('userEmail').value;
            const date = document.getElementById('bookingDate').value;
            const startTime = document.getElementById('startTime').value;
            const endTime = document.getElementById('endTime').value;
            const purpose = document.getElementById('purpose').value;
            const alert = document.getElementById('bookingAlert');

            if (!equipId || !name || !email || !date || !startTime || !endTime || !purpose) {
                showAlert(alert, 'Please fill all required fields', 'error');
                return;
            }

            if (startTime >= endTime) {
                showAlert(alert, 'End time must be after start time', 'error');
                return;
            }

            const startMinutes = timeToMinutes(startTime);
            const endMinutes = timeToMinutes(endTime);
            const duration = (endMinutes - startMinutes) / 60;
            const eq = equipment.find(e => e.id == equipId);

            if (duration > eq.maxBookingHours) {
                showAlert(alert, `Maximum booking duration is ${eq.maxBookingHours} hours`, 'error');
                return;
            }

            if (!isTimeSlotAvailable(equipId, date, startTime)) {
                showAlert(alert, 'This time slot is already booked', 'error');
                return;
            }

            const booking = {
                id: Date.now(),
                equipmentId: equipId,
                equipmentName: eq.name,
                userName: name,
                userEmail: email,
                date: date,
                startTime: startTime,
                endTime: endTime,
                purpose: purpose,
                bookingDate: new Date().toISOString()
            };

            bookings.push(booking);
            localStorage.setItem('labBookings', JSON.stringify(bookings));

            showAlert(alert, `Successfully booked ${eq.name} for ${date} from ${startTime} to ${endTime}`, 'success');
            
            setTimeout(() => {
                document.getElementById('equipmentSelect').value = '';
                document.getElementById('userName').value = '';
                document.getElementById('userEmail').value = '';
                document.getElementById('purpose').value = '';
                document.getElementById('timeSlots').innerHTML = '';
                updateTimeSlots();
                alert.innerHTML = '';
            }, 2000);
        }

        function renderMyBookings() {
            const container = document.getElementById('myBookingsList');
            const today = new Date().toISOString().split('T')[0];
            
            const userBookings = bookings.slice().reverse();
            const upcoming = userBookings.filter(b => b.date >= today).length;
            const completed = userBookings.filter(b => b.date < today).length;

            document.getElementById('totalBookings').textContent = userBookings.length;
            document.getElementById('upcomingBookings').textContent = upcoming;
            document.getElementById('completedBookings').textContent = completed;

            if (userBookings.length === 0) {
                container.innerHTML = '<div class="empty-state"><p>No bookings yet. Start by booking some equipment!</p></div>';
                return;
            }

            container.innerHTML = '';
            userBookings.forEach(booking => {
                const isExpired = booking.date < today;
                const item = document.createElement('div');
                item.className = `booking-item ${isExpired ? 'expired' : ''}`;
                item.innerHTML = `
                    <h4>${booking.equipmentName}</h4>
                    <p><strong>Booking ID:</strong> ${booking.id}</p>
                    <p><strong>Date:</strong> ${new Date(booking.date).toLocaleDateString()}</p>
                    <p><strong>Time:</strong> ${booking.startTime} - ${booking.endTime}</p>
                    <p><strong>Purpose:</strong> ${booking.purpose}</p>
                    <p><strong>Booked by:</strong> ${booking.userName} (${booking.userEmail})</p>
                    <div class="booking-actions">
                        <button class="btn btn-danger" onclick="cancelBooking(${booking.id})">Cancel Booking</button>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        function renderAdminEquipment() {
            const container = document.getElementById('adminEquipmentList');
            container.innerHTML = '';

            equipment.forEach(eq => {
                const card = document.createElement('div');
                card.className = 'equipment-card';
                card.innerHTML = `
                    <h3>${eq.name}</h3>
                    <p><strong>Category:</strong> ${eq.category}</p>
                    <p><strong>Description:</strong> ${eq.description}</p>
                    <p><strong>Max Booking:</strong> ${eq.maxBookingHours} hours</p>
                    <div class="booking-actions">
                        <button class="btn btn-secondary" onclick="editEquipment(${eq.id})">Edit</button>
                        <button class="btn btn-danger" onclick="deleteEquipment(${eq.id})">Delete</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function renderAdminBookings() {
            const container = document.getElementById('adminBookingsList');
            
            if (bookings.length === 0) {
                container.innerHTML = '<div class="empty-state"><p>No bookings yet</p></div>';
                return;
            }

            container.innerHTML = '';
            const sortedBookings = bookings.slice().sort((a, b) => new Date(b.date) - new Date(a.date));
            
            sortedBookings.forEach(booking => {
                const item = document.createElement('div');
                item.className = 'booking-item';
                item.innerHTML = `
                    <h4>${booking.equipmentName}</h4>
                    <p><strong>Booking ID:</strong> ${booking.id}</p>
                    <p><strong>User:</strong> ${booking.userName} (${booking.userEmail})</p>
                    <p><strong>Date:</strong> ${new Date(booking.date).toLocaleDateString()}</p>
                    <p><strong>Time:</strong> ${booking.startTime} - ${booking.endTime}</p>
                    <p><strong>Purpose:</strong> ${booking.purpose}</p>
                    <div class="booking-actions">
                        <button class="btn btn-danger" onclick="adminDeleteBooking(${booking.id})">Delete</button>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        function addEquipment() {
            const name = document.getElementById('adminEquipName').value;
            const category = document.getElementById('adminEquipCategory').value;
            const description = document.getElementById('adminEquipDesc').value;

            if (!name || !category) {
                alert('Please fill in equipment name and category');
                return;
            }

            const newEquip = {
                id: Math.max(...equipment.map(e => e.id), 0) + 1,
                name: name,
                category: category,
                description: description,
                maxBookingHours: 4
            };

            equipment.push(newEquip);
            localStorage.setItem('labEquipment', JSON.stringify(equipment));

            document.getElementById('adminEquipName').value = '';
            document.getElementById('adminEquipCategory').value = '';
            document.getElementById('adminEquipDesc').value = '';

            renderEquipmentBrowse();
            populateEquipmentSelect();
            renderAdminEquipment();

            alert('Equipment added successfully!');
        }

        function deleteEquipment(id) {
            if (confirm('Are you sure you want to delete this equipment?')) {
                equipment = equipment.filter(e => e.id !== id);
                localStorage.setItem('labEquipment', JSON.stringify(equipment));
                renderEquipmentBrowse();
                populateEquipmentSelect();
                renderAdminEquipment();
            }
        }

        function editEquipment(id) {
            const eq = equipment.find(e => e.id === id);
            const newName = prompt('Equipment name:', eq.name);
            if (newName) {
                eq.name = newName;
                localStorage.setItem('labEquipment', JSON.stringify(equipment));
                renderEquipmentBrowse();
                populateEquipmentSelect();
                renderAdminEquipment();
            }
        }

        function cancelBooking(id) {
            if (confirm('Are you sure you want to cancel this booking?')) {
                bookings = bookings.filter(b => b.id !== id);
                localStorage.setItem('labBookings', JSON.stringify(bookings));
                renderMyBookings();
                renderEquipmentBrowse();
            }
        }

        function adminDeleteBooking(id) {
            if (confirm('Are you sure you want to delete this booking?')) {
                bookings = bookings.filter(b => b.id !== id);
                localStorage.setItem('labBookings', JSON.stringify(bookings));
                renderAdminBookings();
            }
        }

        function showAlert(container, message, type) {
            container.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
            setTimeout(() => {
                if (type === 'success') container.innerHTML = '';
            }, 5000);
        }

        function timeToMinutes(time) {
            const [hours, minutes] = time.split(':').map(Number);
            return hours * 60 + minutes;
        }
    </script>
</body>
</html>
